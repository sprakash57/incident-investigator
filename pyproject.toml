[project]
name = "incident-investigator"
version = "0.1.0"
description = "AI assistant that investigates production incidents across pluggable log, metric and change sources."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai,anthropic]>=2.61",
    "pydantic-settings>=2.16",
    "python-dotenv>=1.2.4",
    "rich>=15.0",
    "typer>=0.27",
]

[project.scripts]
iinv = "incident_investigator.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
